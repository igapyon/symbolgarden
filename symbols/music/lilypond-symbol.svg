<svg width="1200" height="1200" viewBox="0 0 1200 1200" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">LilyPond symbol</title>
  <desc id="desc">A LilyPond symbol inspired by engraved score output and notation source text.</desc>
  <defs>
