    </g>

    <g transform="rotate(8 650 650)">
      <rect x="520" y="454" width="248" height="344" rx="36" fill="url(#card)"/>
      <rect x="544" y="478" width="200" height="296" rx="24" stroke="#D9D2CB" stroke-width="8"/>
      <text x="584" y="560" fill="#22252A" font-family="'Avenir Next', 'Futura', 'Trebuchet MS', sans-serif" font-size="78" font-weight="800">A</text>
      <path d="M594 628C594 608 610 592 630 592C650 592 666 608 666 628C666 664 630 694 630 694C630 694 594 664 594 628Z" fill="#22252A"/>
      <rect x="574" y="716" width="142" height="24" rx="12" fill="#2C7358" fill-opacity="0.18"/>
    </g>
  </g>
</svg>
