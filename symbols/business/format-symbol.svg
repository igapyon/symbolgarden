    </g>

    <g stroke="#7C63C7" stroke-width="12" stroke-linecap="round">
      <path d="M776 488V838"/>
      <path d="M816 488V838"/>
    </g>

    <g fill="#7C63C7">
      <path d="M710 544L760 514V574L710 544Z"/>
